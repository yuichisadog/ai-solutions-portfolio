[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-solutions-portfolio"
version = "1.0.0"
authors = [
  { name="Juan Santos Oliveira", email="juan.jso2000@gmail.com" },
]
description = "Enterprise AI Engineering, Autonomous Agents, LLM Prompt Architecture & Production Workflow Automations"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6.0",
    "python-pptx>=0.6.21",
    "requests>=2.31.0",
    "selenium>=4.18.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0"
]
